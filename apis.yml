aid: cybrary
name: Cybrary
description: 'Cybrary is a cybersecurity and IT skills-development platform used by
  individuals and enterprise teams for hands-on training, certification preparation
  and workforce upskilling. The catalog spans certification prep paths (Security+,
  CISSP, CISA, CISM, CCSP, CCNA, AWS security tracks), role-based career paths (SOC
  analyst, penetration tester, security engineer, incident handler, network engineer),
  skill paths, virtual labs, assessments and security awareness training. Cybrary for
  Teams adds administrative surfaces for enterprise customers — SAML 2.0 single sign-on
  with Okta, OneLogin and Microsoft Entra ID, SCIM 2.0 automated user provisioning
  with a per-tenant base URL and bearer token, bulk user upload, goals and custom
  career paths. Its one publicly documented API is the Completions Export Integration,
  an OAuth 2.0 client-credentials REST API that returns daily course, lab, assessment
  and career-path completion events as xAPI (Experience API) statements for ingestion
  into a customer LMS, HRIS or reporting warehouse.'
