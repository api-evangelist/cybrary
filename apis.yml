apis:
- aid: cybrary:completions-export
  name: Cybrary Completions Export API
  description: 'REST API that exposes daily completion events for a Cybrary for Teams
    organization. A completion event is generated whenever a member of the organization
    completes a course, lab, assessment or career path. Exports are delivered as JSON
    arrays of xAPI (Experience API / ADL) statements — actor, verb, object and result
    — with Cybrary extensions carrying the content description id, continuing education
    units and learning hours. One file is generated per UTC day; the API lists the
    available export dates, retrieves a specific date, or retrieves the latest. Access
    is OAuth 2.0 client credentials with the `use-integrations` scope; credentials
    are issued by Cybrary to the customer.'
  humanURL: https://help.cybrary.it/completions-export-integration
  baseURL: https://app.cybrary.it/courses/api
  tags:
